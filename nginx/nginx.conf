events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream definitions
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # --------------------------------------------------------
        # API routes — strip /api prefix before forwarding
        # Convention: nginx receives /api/<path>, forwards as /<path> to backend
        # Example: curl localhost/api/health → backend:8000/health
        # Example: curl localhost/api/auth/login → backend:8000/auth/login
        # Note: backend FastAPI routes do NOT include /api/ prefix
        # --------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------
        # WebSocket — /ws and /ws/prices
        # --------------------------------------------------------
        location /ws {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     86400s;
        }

        # --------------------------------------------------------
        # Frontend — React dev server (incl. Vite HMR WS)
        # --------------------------------------------------------
        location / {
            proxy_pass           http://frontend;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            # Vite HMR requires WebSocket upgrade
            proxy_http_version   1.1;
            proxy_set_header     Upgrade    $http_upgrade;
            proxy_set_header     Connection "upgrade";
            proxy_read_timeout   86400s;
        }
    }
}
